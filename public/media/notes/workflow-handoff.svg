<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">A workflow handoff has four proofs</title>
  <desc id="desc">A Keith Staggers Studio diagram showing that a new owner must run, stop, recover, and own an AI-assisted workflow.</desc>
  <rect width="1200" height="630" fill="#050608"/>
  <g stroke="#282c36" stroke-width="1" opacity=".65">
    <path d="M40 108h1120M40 204h1120M40 300h1120M40 396h1120M40 492h1120"/>
    <path d="M120 36v558M312 36v558M504 36v558M696 36v558M888 36v558M1080 36v558"/>
  </g>
  <circle cx="66" cy="64" r="7" fill="#2851ff"/>
  <text x="88" y="72" fill="#f4f6fb" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">KEITH STAGGERS</text>
  <text x="1135" y="72" fill="#727786" text-anchor="end" font-family="monospace" font-size="14">STUDIO NOTE 04</text>
  <text x="64" y="160" fill="#f4f6fb" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="760">A handoff has</text>
  <text x="64" y="224" fill="#2851ff" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="760">four proofs.</text>
  <text x="64" y="270" fill="#a8abb7" font-family="Inter, Arial, sans-serif" font-size="23">The builder steps back. The new owner takes the controls.</text>
  <g transform="translate(64 348)" font-family="Inter, Arial, sans-serif">
    <g>
      <rect width="224" height="128" rx="4" fill="#0b0d13" stroke="#2851ff" stroke-width="2"/>
      <text x="24" y="34" fill="#727786" font-family="monospace" font-size="13">01 · NORMAL PATH</text>
      <text x="24" y="77" fill="#f4f6fb" font-size="28" font-weight="700">RUN IT</text>
      <text x="24" y="105" fill="#a8abb7" font-size="16">Reach verified output</text>
    </g>
    <path d="M238 64h42" stroke="#2851ff" stroke-width="3"/><path d="m268 54 14 10-14 10" fill="none" stroke="#2851ff" stroke-width="3"/>
    <g transform="translate(296)">
      <rect width="224" height="128" rx="4" fill="#0b0d13" stroke="#7139ff" stroke-width="2"/>
      <text x="24" y="34" fill="#727786" font-family="monospace" font-size="13">02 · EXCEPTION</text>
      <text x="24" y="77" fill="#f4f6fb" font-size="28" font-weight="700">STOP IT</text>
      <text x="24" y="105" fill="#a8abb7" font-size="16">Recognize the gate</text>
    </g>
    <path d="M534 64h42" stroke="#7139ff" stroke-width="3"/><path d="m564 54 14 10-14 10" fill="none" stroke="#7139ff" stroke-width="3"/>
    <g transform="translate(592)">
      <rect width="224" height="128" rx="4" fill="#0b0d13" stroke="#7139ff" stroke-width="2"/>
      <text x="24" y="34" fill="#727786" font-family="monospace" font-size="13">03 · FAILURE</text>
      <text x="24" y="77" fill="#f4f6fb" font-size="28" font-weight="700">RECOVER IT</text>
      <text x="24" y="105" fill="#a8abb7" font-size="16">Resume without guessing</text>
    </g>
    <path d="M830 64h42" stroke="#ff604d" stroke-width="3"/><path d="m860 54 14 10-14 10" fill="none" stroke="#ff604d" stroke-width="3"/>
    <g transform="translate(888)">
      <rect width="224" height="128" rx="4" fill="#0b0d13" stroke="#ff604d" stroke-width="3"/>
      <text x="24" y="34" fill="#ff604d" font-family="monospace" font-size="13">04 · OWNERSHIP</text>
      <text x="24" y="77" fill="#f4f6fb" font-size="28" font-weight="700">OWN IT</text>
      <text x="24" y="105" fill="#a8abb7" font-size="16">Use it without builder</text>
    </g>
  </g>
  <text x="64" y="582" fill="#727786" font-family="monospace" font-size="14">BUILD THE WORKFLOW. KEEP THE JUDGMENT.</text>
  <text x="1136" y="582" fill="#a8abb7" text-anchor="end" font-family="monospace" font-size="14">KEITHSTAGGERS.COM</text>
</svg>

