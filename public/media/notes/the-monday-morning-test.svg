<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AI training should change Monday morning</title>
  <desc id="desc">A Keith Staggers Studio diagram showing practical training moving from real work to practice, guardrails, and next use.</desc>
  <rect width="1200" height="630" fill="#050608"/>
  <g stroke="#282c36" stroke-width="1" opacity=".65"><path d="M40 108h1120M40 204h1120M40 300h1120M40 396h1120M40 492h1120"/><path d="M120 36v558M312 36v558M504 36v558M696 36v558M888 36v558M1080 36v558"/></g>
  <circle cx="66" cy="64" r="7" fill="#2851ff"/><text x="88" y="72" fill="#f4f6fb" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">KEITH STAGGERS</text><text x="1135" y="72" fill="#727786" text-anchor="end" font-family="monospace" font-size="14">STUDIO NOTE 02</text>
  <text x="64" y="164" fill="#f4f6fb" font-family="Inter,Arial,sans-serif" font-size="56" font-weight="760">AI training should change</text><text x="64" y="228" fill="#2851ff" font-family="Inter,Arial,sans-serif" font-size="56" font-weight="760">Monday morning.</text>
  <text x="64" y="274" fill="#a8abb7" font-family="Inter,Arial,sans-serif" font-size="23">A working habit beats a folder full of slides.</text>
  <g transform="translate(64 348)" font-family="Inter,Arial,sans-serif">
    <g><text x="0" y="20" fill="#727786" font-family="monospace" font-size="13">01</text><text x="0" y="60" fill="#f4f6fb" font-size="25" font-weight="700">REAL WORK</text><text x="0" y="90" fill="#a8abb7" font-size="16">Choose the task first</text></g><path d="M190 54h64" stroke="#2851ff" stroke-width="3"/><path d="m242 44 14 10-14 10" fill="none" stroke="#2851ff" stroke-width="3"/>
    <g transform="translate(278)"><text x="0" y="20" fill="#727786" font-family="monospace" font-size="13">02</text><text x="0" y="60" fill="#f4f6fb" font-size="25" font-weight="700">PRACTICE</text><text x="0" y="90" fill="#a8abb7" font-size="16">Build during the session</text></g><path d="M478 54h64" stroke="#7139ff" stroke-width="3"/><path d="m530 44 14 10-14 10" fill="none" stroke="#7139ff" stroke-width="3"/>
    <g transform="translate(566)"><text x="0" y="20" fill="#727786" font-family="monospace" font-size="13">03</text><text x="0" y="60" fill="#f4f6fb" font-size="25" font-weight="700">GUARDRAILS</text><text x="0" y="90" fill="#a8abb7" font-size="16">Know what stays human</text></g><path d="M786 54h64" stroke="#ff604d" stroke-width="3"/><path d="m838 44 14 10-14 10" fill="none" stroke="#ff604d" stroke-width="3"/>
    <g transform="translate(874)"><text x="0" y="20" fill="#ff604d" font-family="monospace" font-size="13">04</text><text x="0" y="60" fill="#f4f6fb" font-size="25" font-weight="700">NEXT USE</text><text x="0" y="90" fill="#a8abb7" font-size="16">Repeat it on Monday</text></g>
  </g>
  <text x="64" y="582" fill="#727786" font-family="monospace" font-size="14">BUILD THE WORKFLOW. KEEP THE JUDGMENT.</text><text x="1136" y="582" fill="#a8abb7" text-anchor="end" font-family="monospace" font-size="14">KEITHSTAGGERS.COM</text>
</svg>
