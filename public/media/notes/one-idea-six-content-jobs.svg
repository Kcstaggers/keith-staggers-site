<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">One canonical source can do six content jobs</title>
  <desc id="desc">A Keith Staggers Studio diagram showing one finished source adapted for LinkedIn, Facebook, Instagram, X, newsletter, and YouTube.</desc>
  <rect width="1200" height="630" fill="#050608"/>
  <g stroke="#282c36" stroke-width="1" opacity=".65">
    <path d="M40 108h1120M40 204h1120M40 300h1120M40 396h1120M40 492h1120"/>
    <path d="M120 36v558M312 36v558M504 36v558M696 36v558M888 36v558M1080 36v558"/>
  </g>
  <circle cx="66" cy="64" r="7" fill="#2851ff"/>
  <text x="88" y="72" fill="#f4f6fb" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">KEITH STAGGERS</text>
  <text x="1135" y="72" fill="#727786" text-anchor="end" font-family="monospace" font-size="14">STUDIO NOTE 05</text>
  <text x="64" y="160" fill="#f4f6fb" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="760">One source.</text>
  <text x="64" y="224" fill="#2851ff" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="760">Six different jobs.</text>
  <text x="64" y="270" fill="#a8abb7" font-family="Inter, Arial, sans-serif" font-size="23">Adapt the role. Keep the truth.</text>
  <g transform="translate(64 332)" font-family="Inter, Arial, sans-serif">
    <rect x="0" y="36" width="232" height="144" rx="4" fill="#0b0d13" stroke="#ff604d" stroke-width="3"/>
    <text x="24" y="72" fill="#ff604d" font-family="monospace" font-size="13">CANONICAL</text>
    <text x="24" y="111" fill="#f4f6fb" font-size="27" font-weight="700">FINISHED</text>
    <text x="24" y="142" fill="#f4f6fb" font-size="27" font-weight="700">SOURCE</text>
    <text x="24" y="166" fill="#a8abb7" font-size="15">Facts · method · proof</text>
    <path d="M246 108h68" stroke="#ff604d" stroke-width="3"/><path d="m302 98 14 10-14 10" fill="none" stroke="#ff604d" stroke-width="3"/>
    <g transform="translate(334)">
      <rect width="238" height="92" rx="4" fill="#0b0d13" stroke="#2851ff" stroke-width="2"/>
      <text x="20" y="33" fill="#727786" font-family="monospace" font-size="12">LINKEDIN</text><text x="20" y="65" fill="#f4f6fb" font-size="22" font-weight="700">Teach the lesson</text>
      <rect y="116" width="238" height="92" rx="4" fill="#0b0d13" stroke="#2851ff" stroke-width="2"/>
      <text x="20" y="149" fill="#727786" font-family="monospace" font-size="12">FACEBOOK</text><text x="20" y="181" fill="#f4f6fb" font-size="22" font-weight="700">Carry the story</text>
    </g>
    <g transform="translate(592)">
      <rect width="238" height="92" rx="4" fill="#0b0d13" stroke="#7139ff" stroke-width="2"/>
      <text x="20" y="33" fill="#727786" font-family="monospace" font-size="12">INSTAGRAM</text><text x="20" y="65" fill="#f4f6fb" font-size="22" font-weight="700">Show the proof</text>
      <rect y="116" width="238" height="92" rx="4" fill="#0b0d13" stroke="#7139ff" stroke-width="2"/>
      <text x="20" y="149" fill="#727786" font-family="monospace" font-size="12">X</text><text x="20" y="181" fill="#f4f6fb" font-size="22" font-weight="700">Isolate insight</text>
    </g>
    <g transform="translate(850)">
      <rect width="238" height="92" rx="4" fill="#0b0d13" stroke="#ff604d" stroke-width="2"/>
      <text x="20" y="33" fill="#727786" font-family="monospace" font-size="12">NEWSLETTER</text><text x="20" y="65" fill="#f4f6fb" font-size="22" font-weight="700">Install the habit</text>
      <rect y="116" width="238" height="92" rx="4" fill="#0b0d13" stroke="#ff604d" stroke-width="2"/>
      <text x="20" y="149" fill="#727786" font-family="monospace" font-size="12">YOUTUBE</text><text x="20" y="181" fill="#f4f6fb" font-size="22" font-weight="700">Demonstrate it</text>
    </g>
  </g>
  <text x="64" y="582" fill="#727786" font-family="monospace" font-size="14">BUILD THE WORKFLOW. KEEP THE JUDGMENT.</text>
  <text x="1136" y="582" fill="#a8abb7" text-anchor="end" font-family="monospace" font-size="14">KEITHSTAGGERS.COM</text>
