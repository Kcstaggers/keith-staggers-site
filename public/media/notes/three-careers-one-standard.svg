<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Three careers, one standard</title>
  <desc id="desc">A Keith Staggers Studio diagram connecting investigation, nurse leadership, and AI production through observation, judgment, and finishing.</desc>
  <rect width="1200" height="630" fill="#050608"/>
  <g stroke="#282c36" stroke-width="1" opacity=".65"><path d="M40 108h1120M40 204h1120M40 300h1120M40 396h1120M40 492h1120"/><path d="M120 36v558M312 36v558M504 36v558M696 36v558M888 36v558M1080 36v558"/></g>
  <circle cx="66" cy="64" r="7" fill="#2851ff"/><text x="88" y="72" fill="#f4f6fb" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">KEITH STAGGERS</text><text x="1135" y="72" fill="#727786" text-anchor="end" font-family="monospace" font-size="14">STUDIO NOTE 03</text>
  <text x="64" y="164" fill="#f4f6fb" font-family="Inter,Arial,sans-serif" font-size="62" font-weight="760">Three careers.</text><text x="64" y="232" fill="#2851ff" font-family="Inter,Arial,sans-serif" font-size="62" font-weight="760">One standard.</text>
  <text x="64" y="278" fill="#a8abb7" font-family="Inter,Arial,sans-serif" font-size="23">The titles changed. The operating code did not.</text>
  <g transform="translate(64 344)" font-family="Inter,Arial,sans-serif">
    <rect width="300" height="134" rx="4" fill="#0b0d13" stroke="#2851ff" stroke-width="2"/><text x="24" y="34" fill="#727786" font-family="monospace" font-size="13">1992 TO 2013</text><text x="24" y="75" fill="#f4f6fb" font-size="26" font-weight="700">DETECTIVE</text><text x="24" y="108" fill="#a8abb7" font-size="17">Observe · separate evidence</text>
    <rect x="354" width="300" height="134" rx="4" fill="#0b0d13" stroke="#7139ff" stroke-width="2"/><text x="378" y="34" fill="#727786" font-family="monospace" font-size="13">2014 TO NOW</text><text x="378" y="75" fill="#f4f6fb" font-size="26" font-weight="700">NURSE LEADER</text><text x="378" y="108" fill="#a8abb7" font-size="17">Explain · keep judgment</text>
    <rect x="708" width="356" height="134" rx="4" fill="#0b0d13" stroke="#ff604d" stroke-width="3"/><text x="732" y="34" fill="#727786" font-family="monospace" font-size="13">2022 TO NOW</text><text x="732" y="75" fill="#f4f6fb" font-size="26" font-weight="700">AI CREATOR</text><text x="732" y="108" fill="#a8abb7" font-size="17">Build · verify · finish</text>
  </g>
  <text x="64" y="582" fill="#727786" font-family="monospace" font-size="14">READ THE ROOM. FIND THE PATTERN. FINISH THE JOB.</text><text x="1136" y="582" fill="#a8abb7" text-anchor="end" font-family="monospace" font-size="14">KEITHSTAGGERS.COM</text>
</svg>
